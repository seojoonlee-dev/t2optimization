# fand settings. Anything left out uses the default in src/control.rs (Config).
# Paths are relative to this file's directory.
# Restart the daemon to apply changes.

# rc3mwb-a: rc3m + I/O (Wi-Fi + SSD path rails) and battery-charge nodes, all
# params refit on all logs, with a hottest-core model (2026-10-28); rc3m-c is
# the fallback if this misbehaves
model = "../models/rc3mwb-a.json"

# the hottest core is kept under this by setting PL2 every second (the CPU's
# own thermal throttle is at 100 °C; user, 2026-10-28)
die_limit_c = 98.0

# caps move toward the plan's every second, at most this much up / down per
# second while Ts1S is under the ceiling (over it they cut at once): cutting at
# once made the dGPU go 10-22-14-22 W in a game; 2 W up / 1 W down per 5 s plan
# showed as visible steps (user, 2026-10-28)
cap_rise_w_per_s = 0.5
cap_fall_w_per_s = 0.5

# after a mode switch the caps go from where they were to the new mode's in a
# straight line over this many seconds: at once was a jump, at the rate above
# balanced -> eco took ~40 s (user: 5 s, changes visible right away)
mode_switch_s = 5.0

# fans go up at most this fast for the plan and a binding power cap (both
# jumped, e.g. 2080 -> 3800 rpm a few seconds into a game); the safety floors
# (die temperatures, Ts1S over, SMC throttle) still jump. 50 -> 100: at 50 a
# switch to perf near the ceiling went 0.3 °C over (user, 2026-10-28)
up_rpm_per_s = 100.0

# extra heat is saved when fand stops and picked up by a start within this
# many seconds, if the model is the same (user, 2026-10-28)
heat_keep_s = 600

# PL1/PL2 are only rewritten when one would move by at least this (W); the
# hottest-core limit moved them ~37 times a minute at idle (user, 2026-10-28)
pl_step_w = 0.5

# Ts1S the plan must stay under. The SMC's budget set point is 44.989 °C, and
# the model's 90 s error is ~0.4 °C rms, so 44.6 leaves about one sigma.
ceiling_c = 44.6

# extra heat (integral action) isn't lowered while Ts1S, under the ceiling,
# has risen more than heat_rising_c in the last heat_rising_s: the plan brings
# Ts1S up to the ceiling over minutes, and reading that climb as "less heat"
# loosened the caps and overshot to 45.5 °C in balanced compiles (sim,
# 2026-10-27; user picked these values)
heat_rising_s = 30
heat_rising_c = 0.05

# eco keeps the CPU package around this on average (RAPL W), bursting to the
# PL1 maximum for ~eco_burst_s once it has been under it for a while
# (user, 2026-10-24: 6-10 W sustained, still boosting when needed). The iGPU
# shares this budget: 9 W once starved the cores during iGPU video decode
eco_sustained_w = 8.0
eco_burst_s = 30.0

# eco's hard dGPU cap (power1_cap W, no burst; user, 2026-10-25). Without it
# eco let Minecraft hold the dGPU at ~20-25 W (2026-10-24). The rail (PG0R)
# read ~1.5-2.5 W above the cap in a short 2026-10-25 log
eco_dgpu_cap_w = 10.0

# while that budget holds the package, the cores are fenced (RAPL PP0) at the
# package minus eco_uncore_w and the package limit rises by eco_igpu_w for the
# iGPU only: capped at 8 W the cores took everything and the iGPU sat at
# 100-250 MHz (desktop lag, 2026-10-24). 6 W ~ the iGPU's p90 at 500-1300 MHz
# in the 2026-10-19 logs; 4 W ~ the non-core package power at the cap
eco_igpu_w = 6.0
eco_uncore_w = 4.0

# fans never go below / above these (mean of the two fans, rpm);
# the SMC's own range is ~2080-5708
min_rpm = 0
max_rpm = 99999

# die-temperature floors: fans start rising at the first value and reach full
# speed at the second, past any mode's fan ceiling; power caps are never cut
# for die temperature (user, 2026-10-20)
cpu_floor_c = [90.0, 100.0]
# the CPU floor follows the mean of all cores (coretemp), averaged over this
# many seconds, not the hottest core: one-second spikes from short bursts on a
# core or two set fans to ~5300 rpm on TCMX (2026-10-27). 1 = no smoothing,
# like the GPU floor: the core mean rarely spikes, and a 5 s mean only delayed
# the first crossing by 2 s. Logs without the core mean fall back to TCMX.
cpu_floor_avg_s = 1
gpu_floor_c = [90.0, 100.0]

# fan ceilings per mode (mean rpm): plans stay under these; safety floors may
# go past. balanced 3300 -> 3500 (user, 2026-10-27): ~+0.9 W sustained in sim;
# 3500 -> 4000 -> 3800 (user, 2026-10-27)
[fan_ceiling_rpm]
eco = 2500
balanced = 3800
