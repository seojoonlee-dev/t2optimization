[package]
name = "t2opt-fand"
version = "0.1.0"
edition = "2021"
description = "Model-predictive fan daemon for T2 MacBooks (PoC)"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
